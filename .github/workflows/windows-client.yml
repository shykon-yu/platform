name: Build Windows Client

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Win7-compatible NSIS installer
    runs-on: windows-latest

    env:
      RUST_LOCK_TOOLCHAIN: 1.84.1
      RUST_BUILD_TOOLCHAIN: 1.77.2
      RUST_TARGET: x86_64-pc-windows-msvc

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Rust for dependency resolution
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_LOCK_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Cargo.lock
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml -p cargo_toml --precise 0.17.2
          cargo update --manifest-path src-tauri/Cargo.toml -p toml --precise 0.8.19
          cargo update --manifest-path src-tauri/Cargo.toml -p toml_edit --precise 0.22.22
          cargo update --manifest-path src-tauri/Cargo.toml -p toml_datetime --precise 0.6.8
          cargo update --manifest-path src-tauri/Cargo.toml -p serde_spanned --precise 0.6.8
          cargo update --manifest-path src-tauri/Cargo.toml -p zeroize --precise 1.8.1
          cargo update --manifest-path src-tauri/Cargo.toml -p zeroize_derive --precise 1.4.2
          $lockVersion = Select-String -Path src-tauri/Cargo.lock -Pattern '^version = ' | Select-Object -First 1
          Write-Host $lockVersion.Line
          if ($lockVersion.Line -ne 'version = 3') {
            throw 'Cargo.lock must stay at version 3 for Rust 1.77.2'
          }

      - name: Setup Rust for Win7 build
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_BUILD_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis --target $env:RUST_TARGET --ci

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: wel-platform-windows-win7-nsis
          path: frontend/src-tauri/target/${{ env.RUST_TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: error
