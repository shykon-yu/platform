[package]
name = "pes8-platform"
version = "0.1.0"
description = "WE8 online arena desktop client"
authors = ["WEL Platform"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "pes8_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pes8-platform"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
