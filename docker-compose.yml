services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pes8_platform}
      MYSQL_USER: ${MYSQL_USER:-pes8}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pes8-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root-dev-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis-dev-password}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis-dev-password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    environment:
      APP_ENV: development
      API_PORT: ${API_PORT:-8080}
      MYSQL_DSN: ${MYSQL_USER:-pes8}:${MYSQL_PASSWORD:-pes8-dev-password}@tcp(mysql:3306)/${MYSQL_DATABASE:-pes8_platform}?parseTime=true&charset=utf8mb4&loc=Local
      SOCCER_MYSQL_DSN: ${SOCCER_MYSQL_DSN:-}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:1420,http://localhost:5173,http://tauri.localhost,https://tauri.localhost,tauri://localhost}
      SOFTETHER_MODE: mock
      SOFTETHER_CLIENT_HOST: ${SOFTETHER_CLIENT_HOST:-pending-softether-host}
      SOFTETHER_CLIENT_PORT: ${SOFTETHER_CLIENT_PORT:-443}
      OPENVPN_CLIENT_PORT_BASE: ${OPENVPN_CLIENT_PORT_BASE:-12000}
      OPENVPN_ROOM_PORTS: ${OPENVPN_ROOM_PORTS:-}
      SOFTETHER_ADMIN_ENDPOINT: ${SOFTETHER_ADMIN_ENDPOINT:-localhost:5555}
      SOFTETHER_ADMIN_PASSWORD: ${SOFTETHER_ADMIN_PASSWORD:-}
      SOFTETHER_VPNCMD_PATH: ${SOFTETHER_VPNCMD_PATH:-/usr/local/bin/vpncmd}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_cache:/go/pkg/mod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  go_cache:
